  <!-- Anti-Flicker (Mencegah kedipan tema saat halaman dimuat) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('portfolio_theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = savedTheme ? savedTheme : (prefersLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

       ======================================================================== -->
  <div id="certificate-lightbox" class="lightbox-container" role="dialog" aria-modal="true" aria-label="Tampilan Besar Sertifikat">
    <button id="btn-close-lightbox" type="button" class="absolute top-4 right-4 sm:top-6 sm:right-6 p-3 bg-[var(--surface)] text-[var(--ink)] border-2 border-[var(--line)] shadow-[3px_3px_0_var(--shadow-hard)] hover:bg-[var(--accent)] hover:text-[var(--on-accent)] z-50 focus:outline-none cursor-pointer" aria-label="Tutup lightbox (Esc)">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <button id="btn-prev-lightbox" type="button" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 p-3 bg-[var(--surface)] text-[var(--ink)] border-2 border-[var(--line)] shadow-[3px_3px_0_var(--shadow-hard)] hover:bg-[var(--accent)] hover:text-[var(--on-accent)] z-50 focus:outline-none cursor-pointer" aria-label="Sertifikat sebelumnya (Panah Kiri)">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
    </button>

    <div class="lightbox-img-wrapper">
      <img id="lightbox-img" src="" alt="Pratinjau Sertifikat" width="1200" height="850">
    </div>

    <button id="btn-next-lightbox" type="button" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 p-3 bg-[var(--surface)] text-[var(--ink)] border-2 border-[var(--line)] shadow-[3px_3px_0_var(--shadow-hard)] hover:bg-[var(--accent)] hover:text-[var(--on-accent)] z-50 focus:outline-none cursor-pointer" aria-label="Sertifikat berikutnya (Panah Kanan)">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
    </button>

    <div class="mt-5 text-center max-w-2xl px-4">
      <div id="lightbox-badge" class="inline-block chip-poster mb-2 text-xs"></div>
      <h3 id="lightbox-title" class="font-anton text-lg sm:text-xl text-[var(--ink)] mb-1"></h3>
      <p id="lightbox-meta" class="text-xs sm:text-sm font-semibold text-[var(--ink-muted)]"></p>
    </div>
  </div>

       SCRIPTS: Data -> Render -> UI -> Main -> Animasi
